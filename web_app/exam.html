<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Exam...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <main class="main-content">
            <div class="breadcrumbs" style="color:var(--moodle-blue); margin-bottom: 15px; font-size: 0.9rem;">
                CNV Hub / Exam / <span id="breadcrumb-title"></span>
            </div>
            <div style="display:flex; align-items:center; gap: 10px; margin-bottom: 20px;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e01a76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 11l3 3L22 4"></path>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <h1 id="exam-title" style="color:var(--moodle-dark-blue); font-size: 1.8rem; font-weight: 600;">Loading...</h1>
            </div>
            <button class="back-btn" onclick="window.location.href='index.html'">Back</button>

            <div id="questions-container">
                <!-- Questions will be injected here -->
            </div>
        </main>

        <aside class="sidebar">
            <div id="quiz-timer" style="font-weight: bold; color: var(--danger); margin-bottom: 15px; text-align: center; font-size: 1.1rem; border: 1px solid var(--danger); padding: 5px; border-radius: 4px; background-color: #fff;">Time left: <span id="timer">--:--</span></div>
            <h3 style="color:var(--moodle-dark-blue); font-size:1.1rem; font-weight:normal;">Quiz navigation</h3>
            <div id="nav-grid" class="nav-grid">
                <!-- Navigation buttons will be injected here -->
            </div>
            <a href="#" id="submit-btn" style="text-decoration:none; color:var(--moodle-blue); font-size: 0.9rem; margin-top:10px; display:inline-block;">Finish attempt ...</a>
        </aside>
    </div>

    <!-- Evaluation Modal -->
    <div id="evaluation-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Exam Evaluation</h2>
            <div class="score-display">
                <span id="final-score" class="score-number">0</span> / 20
            </div>
            <div class="score-details" id="score-details">
                <!-- Details injected here -->
            </div>
            <button id="close-modal-btn" class="submit-btn">Review Answers</button>
        </div>
    </div>

    <script src="js/engine.js"></script>
</body>
</html>
